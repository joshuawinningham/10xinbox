<svg xmlns="http://www.w3.org/2000/svg" width="200" height="48" viewBox="0 0 200 48">
  <!-- Green background rounded rectangle (p-2 rounded-lg bg-green-600) - p-2 = 8px padding, so 40px total (24+8+8) -->
  <rect x="0" y="4" width="40" height="40" rx="8" fill="#059669"/>
  
  <!-- Mail icon (h-6 w-6 text-white) - 24x24px icon centered in 40x40px container -->
  <g transform="translate(8, 12)">
    <rect width="20" height="16" x="2" y="4" rx="2" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- 10XInbox text (text-xl font-bold text-slate-900) with space-x-3 = 12px margin -->
  <text x="52" y="32" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif" font-size="20" font-weight="700" fill="#1e293b">10XInbox</text>
</svg>